version: "3.9"

# ─────────────────────────────────────────────────────────────────────────
# Meet Agent — docker-compose
#
# Modo solo  (padrão):
#   docker-compose up streamlit
#
# Modo collab (servidor completo):
#   docker-compose --profile collab up
# ─────────────────────────────────────────────────────────────────────────

services:

  # ── Streamlit — interface web ─────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── FastAPI — backend colaborativo ────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - APP_MODE=collab
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["collab"]

  # ── Celery worker — processamento assíncrono ──────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python main.py --worker
    env_file: .env
    environment:
      - APP_MODE=collab
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    profiles: ["collab"]
    deploy:
      replicas: 2

  # ── Redis — broker do Celery ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    profiles: ["collab"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Postgres — banco colaborativo ─────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       meetagent
      POSTGRES_USER:     meetagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetagent_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles: ["collab"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetagent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  postgres_data: