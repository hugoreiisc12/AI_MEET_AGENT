version: "3.9"

# ─────────────────────────────────────────────────────────────────────────
# Meet Agent — docker-compose
#
# Modo solo  (padrão):
#   docker-compose up streamlit
#
# Modo collab (servidor completo):
#   docker-compose --profile collab up
# ─────────────────────────────────────────────────────────────────────────

services:

  # ── Streamlit — interface web ─────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - APP_MODE=collab
      - MONGO_URI=mongodb://mongo:27017/meetagent
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── FastAPI — backend colaborativo ────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - APP_MODE=collab
      - MONGO_URI=mongodb://mongo:27017/meetagent
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["collab"]

  # ── Celery worker — processamento assíncrono ──────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python main.py --worker
    env_file: .env
    environment:
      - APP_MODE=collab
      - MONGO_URI=mongodb://mongo:27017/meetagent
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    profiles: ["collab"]
    healthcheck:
      disable: true
    deploy:
      replicas: 2

  # ── Redis — broker do Celery ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    profiles: ["collab"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB — banco colaborativo ─────────────────────────────────────
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    profiles: ["collab"]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  mongo_data: