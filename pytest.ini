[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --cov=use_cases
    --cov=infrastructure
    --cov=domain
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80

[coverage:run]
omit =
    test/*
    worker/*
    infrastructure/transcriber/pyannote_diarizer.py
    infrastructure/calendar/google_calendar_service.py