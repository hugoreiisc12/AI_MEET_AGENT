[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --cov=domain
    --cov=use_cases
    --cov=infrastructure
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=90

[coverage:run]
omit =
    infrastructure/recorder/pyaudio_recorder.py
    infrastructure/recorder/meet_detector.py